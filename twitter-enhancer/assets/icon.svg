<!--
  twitter-enhancer 图标源文件 —— 脚本管理器列表里那一枚 `@icon`。

  这是**唯一真源**：`vite.config.ts` 在构建时读这个文件、base64 编码成 data URI 写进产物头部。
  所以 SVG 只存在于这一处，产物里没有图片文件、运行时也不发任何网络请求（README「纯本地运行」）。

  画的是什么：两根竖柱 —— 左边窄栏、右边宽列。就是脚本做的两件事：
  把主列放宽（右柱是铺满内容区的时间线），把占地方的右栏让开（左柱）。
  深底白字、纯几何、无渐变 / 无阴影 / 无品牌蓝（取舍见 docs/design-notes.md「脚本图标」）。

  为什么是两根实心柱而不是箭头 / 描边字形：图标在管理器列表里只有 16~32px。
  实心块面的轮廓在这个尺寸下最稳（16px 时窄柱 1.6px、宽柱 7.9px，都还立得住），
  描边或「◀▮▶」那类三段式构图会糊成一团，也容易被读成媒体控制键。
  几何都落在 24 网格上，四周留 4px 余量（某些管理器会自己加圆角 / 圆形裁切）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img"
     aria-label="Twitter / X 页面优化">
  <!-- 底：中性墨黑圆角方块（不含品牌蓝） -->
  <rect width="24" height="24" rx="5.4" fill="#0F1419" />
  <g fill="#FFFFFF">
    <!-- 左：窄栏（2.4 × 12.8），与宽列留 1.6 的空隙 -->
    <rect x="4" y="5.6" width="2.4" height="12.8" rx="1.2" />
    <!-- 右：宽列（11.8 × 12.8），圆角比窄栏大，视觉上是「主体」 -->
    <rect x="8" y="5.6" width="11.8" height="12.8" rx="2.6" />
  </g>
</svg>
